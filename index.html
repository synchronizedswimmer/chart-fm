<script>
  function showTab(tabName) {
    const homeView = document.getElementById("home-tab-view");
    const scrobblesView = document.getElementById("scrobbles-tab-view");
    const navHome = document.getElementById("nav-home");
    const navScrobbles = document.getElementById("nav-scrobbles");
    const settingsUserGroup = document.getElementById("settings-user-group");

    if (tabName === "scrobbles") {
      if (homeView) homeView.style.display = "none";
      if (scrobblesView) scrobblesView.style.display = "block";
      navHome?.classList.remove("active");
      navScrobbles?.classList.add("active");
      if (settingsUserGroup) settingsUserGroup.style.display = "block";
      window.refreshScrobblesChartDimensions?.();
    } else {
      if (scrobblesView) scrobblesView.style.display = "none";
      if (homeView) homeView.style.display = "block";
      navScrobbles?.classList.remove("active");
      navHome?.classList.add("active");
      if (settingsUserGroup) settingsUserGroup.style.display = "none";
      window.refreshHomeChartDimensions?.();
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("has-chart");
    window.initHomeTopAlbums();

    const navHome = document.getElementById("nav-home");
    const navScrobbles = document.getElementById("nav-scrobbles");

    navHome?.addEventListener("click", () => {
      window.location.hash = "home";
    });

    navScrobbles?.addEventListener("click", () => {
      window.location.hash = "scrobbles";
    });

    window.addEventListener("hashchange", () => {
      const isScrobbles = window.location.hash === "#scrobbles";
      showTab(isScrobbles ? "scrobbles" : "home");
    });

    if (window.location.hash === "#scrobbles") {
      showTab("scrobbles");
    }

    // --- Settings Panel Controls ---
    const settingsTabBtn = document.getElementById("settings-tab-btn");
    const settingsPanel = document.getElementById("settings-panel");
    const settingsBackdrop = document.getElementById("settings-backdrop");
    const settingsCloseBtn = document.getElementById("settings-close-btn");
    const sizeSlider = document.getElementById("settings-size-slider");
    const sizeVal = document.getElementById("settings-size-val");
    const gravdynSlider = document.getElementById("settings-gravdyn-slider");
    const gravdynVal = document.getElementById("settings-gravdyn-val");
    const gravitySlider = document.getElementById("settings-gravity-slider");
    const gravityVal = document.getElementById("settings-gravity-val");
    const attractionSlider = document.getElementById("settings-attraction-slider");
    const attractionVal = document.getElementById("settings-attraction-val");
    const mindistSlider = document.getElementById("settings-mindist-slider");
    const mindistVal = document.getElementById("settings-mindist-val");
    const resetBtn = document.getElementById("settings-reset-btn");

    function openSettings() {
      settingsPanel?.classList.add("open");
      settingsBackdrop?.classList.add("open");
    }

    function closeSettings() {
      settingsPanel?.classList.remove("open");
      settingsBackdrop?.classList.remove("open");
    }

    settingsTabBtn?.addEventListener("click", openSettings);
    settingsCloseBtn?.addEventListener("click", closeSettings);
    settingsBackdrop?.addEventListener("click", closeSettings);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && settingsPanel?.classList.contains("open")) {
        closeSettings();
      }
    });

    // Default and current physics state
    const defaultPhysics = { attraction: -15, minDistance: 2, gravity: 0.07, sizeScale: 1.0, gravityDynamics: 1.0 };
    let currentPhysics = Object.assign({}, defaultPhysics);
    try {
      const saved = JSON.parse(localStorage.getItem("chartfm_physics") || "null");
      if (saved) currentPhysics = Object.assign({}, defaultPhysics, saved);
    } catch (e) {}

    window.__chartPhysics = Object.assign({}, currentPhysics);

    function syncControls() {
      if (sizeSlider && sizeVal) {
        const sz = currentPhysics.sizeScale !== undefined ? currentPhysics.sizeScale : 1.0;
        sizeSlider.value = sz.toString();
        sizeVal.textContent = `${Number(sz).toFixed(2)}x`;
      }
      if (gravdynSlider && gravdynVal) {
        const gd = currentPhysics.gravityDynamics !== undefined ? currentPhysics.gravityDynamics : 1.0;
        gravdynSlider.value = gd.toString();
        gravdynVal.textContent = `${Number(gd).toFixed(2)}x`;
      }
      if (gravitySlider && gravityVal) {
        const gv = currentPhysics.gravity !== undefined ? currentPhysics.gravity : 0.07;
        gravitySlider.value = gv.toString();
        gravityVal.textContent = Number(gv).toFixed(2);
      }
      if (attractionSlider && attractionVal) {
        const at = currentPhysics.attraction !== undefined ? currentPhysics.attraction : -15;
        attractionSlider.value = at.toString();
        attractionVal.textContent = at.toString();
      }
      if (mindistSlider && mindistVal) {
        const md = currentPhysics.minDistance !== undefined ? currentPhysics.minDistance : 2;
        mindistSlider.value = md.toString();
        mindistVal.textContent = `${md}px`;
      }
    }

    syncControls();

    function emitPhysicsChange() {
      window.__chartPhysics = Object.assign({}, currentPhysics);
      try {
        localStorage.setItem("chartfm_physics", JSON.stringify(currentPhysics));
      } catch (e) {}
      window.dispatchEvent(new CustomEvent("chartfm-physics-change", { detail: currentPhysics }));
    }

    sizeSlider?.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value) || 0;
      currentPhysics.sizeScale = val;
      if (sizeVal) sizeVal.textContent = `${val.toFixed(2)}x`;
      emitPhysicsChange();
    });

    gravdynSlider?.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value) || 0;
      currentPhysics.gravityDynamics = val;
      if (gravdynVal) gravdynVal.textContent = `${val.toFixed(2)}x`;
      emitPhysicsChange();
    });

    gravitySlider?.addEventListener("input", (e) => {
      const val = parseFloat(e.target.value) || 0.07;
      currentPhysics.gravity = val;
      if (gravityVal) gravityVal.textContent = val.toFixed(2);
      emitPhysicsChange();
    });

    attractionSlider?.addEventListener("input", (e) => {
      const val = parseInt(e.target.value, 10);
      currentPhysics.attraction = isNaN(val) ? -15 : val;
      if (attractionVal) attractionVal.textContent = currentPhysics.attraction.toString();
      emitPhysicsChange();
    });

    mindistSlider?.addEventListener("input", (e) => {
      const val = parseInt(e.target.value, 10);
      currentPhysics.minDistance = isNaN(val) ? 2 : val;
      if (mindistVal) mindistVal.textContent = `${currentPhysics.minDistance}px`;
      emitPhysicsChange();
    });

    resetBtn?.addEventListener("click", () => {
      currentPhysics = Object.assign({}, defaultPhysics);
      syncControls();
      emitPhysicsChange();
    });

    // --- User Scrobbles Lookup ---
    const lastfmForm = document.getElementById("lastfm-form");
    const lastfmStatus = document.getElementById("lastfm-status");
    const settingsUserForm = document.getElementById("settings-user-form");
    const settingsUserInput = document.getElementById("settings-user-input");
    const settingsUserStatus = document.getElementById("settings-user-status");
    const searchContainer = document.getElementById("scrobbles-search-container");
    const chartContainer = document.getElementById("scrobbles-chart-container");

    async function loadUserScrobbles(username) {
      if (!username) return;
      if (settingsUserStatus) settingsUserStatus.textContent = `loading ${username}...`;
      if (lastfmStatus) lastfmStatus.textContent = `loading top albums for ${username}...`;

      try {
        if (searchContainer) searchContainer.style.display = "none";
        if (chartContainer) {
          chartContainer.style.display = "block";
          chartContainer.innerHTML = "";
        }
        await window.initUserTopAlbums(username, chartContainer);
        if (settingsUserStatus) settingsUserStatus.textContent = "";
        closeSettings();
      } catch (error) {
        if (chartContainer) chartContainer.style.display = "none";
        if (searchContainer) searchContainer.style.display = "flex";
        if (lastfmStatus) lastfmStatus.textContent = `Could not load albums: ${error.message}`;
        if (settingsUserStatus) settingsUserStatus.textContent = `Error: ${error.message}`;
      }
    }

    lastfmForm?.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("lastfm-username");
      const username = input ? input.value.trim() : "";
      if (username) {
        if (settingsUserInput) settingsUserInput.value = username;
        loadUserScrobbles(username);
      }
    });

    settingsUserForm?.addEventListener("submit", (e) => {
      e.preventDefault();
      const username = settingsUserInput ? settingsUserInput.value.trim() : "";
      if (username) {
        loadUserScrobbles(username);
      }
    });
  });
</script>
